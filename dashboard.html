<script>
/* Shows problems on screen (App Inventor's WebViewer has no console) */
function showFatal(m){var go=function(){var d=document.getElementById('fatal');if(!d){d=document.createElement('div');d.id='fatal';d.style.cssText='position:fixed;left:0;right:0;top:0;z-index:300;background:#991B1B;color:#fff;padding:10px 12px;font:13px system-ui,sans-serif;word-break:break-word';document.body.appendChild(d)}d.textContent='Problem: '+m+' (tell the developer this message)';var l=document.getElementById('load');if(l)l.parentNode.removeChild(l)};document.body?go():document.addEventListener('DOMContentLoaded',go)}
window.addEventListener('error',function(e){showFatal((e.message||'Script error')+(e.lineno?' [line '+e.lineno+']':''))});
window.addEventListener('unhandledrejection',function(e){showFatal(String(e.reason&&e.reason.message||e.reason))});
try{new Function('async function f(){const a={...{x:1}};return a?.x??1}')}catch(e){showFatal('This phone\'s Android System WebView is too old. Update "Android System WebView" and "Chrome" in the Play Store, then reopen the app.')}
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--p:#2F7D32;--pd:#1B4332;--a:#F5A524;--bg:#FBF8F1;--c:#fff;--ok:#16A34A;--w:#D97706;--d:#DC2626;--m:#64748B;--t:#1E1B2E;--b:#E5E7EB}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--t)}
button,input,select,textarea{font:inherit}
#app{display:flex;min-height:100vh}
.main{flex:1;min-width:0}
header{display:flex;gap:10px;align-items:center;background:var(--c);padding:10px 16px;border-bottom:1px solid var(--b);position:sticky;top:0;z-index:5;flex-wrap:wrap}
header .sp{flex:1}.tag{background:#FEF3C7;color:#92400E;border:1px solid #F5A524;border-radius:99px;padding:3px 10px;font-size:12px;font-weight:600;cursor:help}
.ib{background:none;border:1px solid var(--b);border-radius:8px;padding:6px 10px;cursor:pointer;position:relative}
.dot{position:absolute;top:-6px;right:-6px;background:var(--d);color:#fff;border-radius:99px;font-size:11px;padding:0 5px}
section#page{padding:16px 16px 92px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;overflow-x:auto;background:var(--pd);padding:4px 6px calc(4px + env(safe-area-inset-bottom,0px));box-shadow:0 -2px 10px #0003;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tabs a{flex:0 0 auto;min-width:74px;max-width:96px;text-align:center;padding:6px 6px;border-radius:10px;color:#D9F0D0;font-size:11px;line-height:1.2;cursor:pointer;text-decoration:none;user-select:none}.tabs a:first-child{margin-left:auto}.tabs a:last-child{margin-right:auto}
.tabs a .i{display:block;font-size:20px;line-height:1.3}.tabs a:hover{background:#2F7D32;color:#fff}.tabs a.on{background:var(--a);color:#1B4332;font-weight:700}.tabs a:focus-visible{outline:2px solid #fff}
.card{background:var(--c);border-radius:12px;box-shadow:0 1px 3px #0001;border:1px solid var(--b);padding:14px;margin-bottom:14px}
.bar{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}.bar h2{margin:0;flex:1}
.btn{background:var(--p);color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer}.btn:hover{background:var(--pd)}
.btn.ghost{background:#fff;color:var(--p);border:1px solid var(--p)}.btn.red{background:var(--d)}.btn.sm{padding:3px 8px;font-size:12px}
.toolbar,.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
input,select,textarea{border:1px solid #cbd5e1;border-radius:8px;padding:7px 9px;background:#fff;width:100%}
.toolbar input,.toolbar select,.filters input,.filters select{width:auto}
label{display:block;font-size:12px;color:var(--m);font-weight:600}label input,label select,label textarea{margin-top:3px;color:var(--t);font-weight:400;font-size:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--c);border:1px solid var(--b);border-left:4px solid var(--a);border-radius:12px;padding:12px}
.kpi b{display:block;font-size:22px}.kpi span{color:var(--m);font-size:12px}.kpi small{display:block;color:var(--w);font-size:11px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%}th,td{padding:8px 10px;border-bottom:1px solid var(--b);text-align:left;white-space:nowrap}
th{background:#EEF5E6;cursor:pointer;font-size:12px;color:var(--pd)}tr:hover td{background:#F7FAF2}
.bd{border-radius:99px;padding:2px 8px;font-size:11px;font-weight:600;background:#e2e8f0}.bd.g{background:#DCFCE7;color:#166534}.bd.a{background:#FEF3C7;color:#92400E}.bd.r{background:#FEE2E2;color:#991B1B}
.empty{padding:30px;text-align:center;color:var(--m)}.pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;padding-top:8px}
.ov{position:fixed;inset:0;background:#0007;display:flex;align-items:center;justify-content:center;z-index:50;padding:10px}
.md{background:#fff;border-radius:14px;padding:18px;width:min(640px,100%);max-height:92vh;overflow:auto}.md.sm{width:min(420px,100%)}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}.act{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.err{background:#FEE2E2;color:#991B1B;border-radius:8px;padding:8px 12px;margin-bottom:10px}
.dl{display:grid;grid-template-columns:150px 1fr;gap:4px 10px}.dl dt{color:var(--m)}.dl dd{margin:0}
#toast{position:fixed;right:14px;bottom:92px;z-index:99;display:grid;gap:6px}
#toast div{background:var(--ok);color:#fff;padding:10px 14px;border-radius:8px;box-shadow:0 4px 12px #0003}#toast .e{background:var(--d)}
#load{position:fixed;inset:0;background:#fff;display:flex;align-items:center;justify-content:center;z-index:100;color:var(--p);font-weight:600}
.note{color:var(--m);font-size:12px}canvas{max-height:260px}
#login{background:#1B4332;z-index:200}/* tag states */.tag.g{background:#DCFCE7;color:#166534;border-color:#16A34A}.tag.r{background:#FEE2E2;color:#991B1B;border-color:#DC2626}tr.pv td{background:#FFFBEB}#rcpt{display:none}.rc{max-width:380px;margin:0 auto;text-align:center;background:#fff;border:1px solid var(--b);border-radius:10px;overflow:hidden;font-size:13px}.rc .rh{background:var(--p);color:#fff;padding:14px;text-align:center}.rc .rh b{font-size:17px;display:block}.rc .rb{padding:12px 14px}.rc table td,.rc table th{padding:4px 0;white-space:normal;border:0}.rc .tot td{border-top:1px solid var(--b);font-weight:700}.rc .cr{padding:2px 0}.rc .cr span{color:var(--m)}.rc hr{border:0;border-top:1px solid var(--b);margin:10px 40px}.rc .big{font-size:15px;font-weight:700;margin-top:6px}.rc .bal{font-size:16px;font-weight:700;color:var(--pd);margin:4px 0}.rc .ft{text-align:center;color:var(--m);padding:10px;border-top:1px dashed var(--b);font-size:12px}
@media print{body.pr #app,body.pr #mod,body.pr #toast{display:none!important}body.pr #rcpt{display:flex;justify-content:center;align-items:flex-start;padding-top:20mm}header,.tabs,.toolbar,.filters,.btn,.noprint{display:none!important}.card{box-shadow:none}}
.rc{max-width:310px;margin:0 auto;text-align:left;background:#fff;border:1px dashed #9CA3AF;border-radius:2px;padding:14px 10px;font-family:'Courier New',Courier,monospace;font-size:12px;line-height:1.35;color:#111;overflow:auto}.rc pre{margin:0;font:inherit;white-space:pre}
img.lg{height:38px;width:auto;vertical-align:middle;margin-right:4px}
#load img{display:block;height:110px;margin:0 auto 12px}#load div{text-align:center}
.prhead{display:none}.rc .rl{display:block;width:64px;height:64px;margin:0 auto 8px}
@media print{.prhead{display:flex;align-items:center;gap:12px;border-bottom:3px solid #2F7D32;padding-bottom:8px;margin-bottom:12px}.prhead img{height:64px;width:64px}.prhead b{display:block;font-size:18px;color:#1B4332}.prhead span{color:#64748B;font-size:12px}}

function saveSettings(){if(!need('settings'))return;const e=+$('#s2').value,f=$('#s1').value.trim();if(!f||!(e>=1&&e<=100))return notify('Enter a farm name and eggs per crate between 1 and 100.','e');const old={...DB.settings};const raw=$('#s5').value.trim(),oo=Math.max(0,Math.round(+raw||0)),restart=raw!==''&&(!old.eggStart||oo!==(+old.eggOpen||0)),ex={eggUnit:$('#s4').value,eggOpen:raw===''?(+old.eggOpen||0):oo,eggStart:restart?today():(old.eggStart||''),feedOn:$('#s6').value==='1',feedLvl:Math.max(0,+$('#s7').value||0)};DB.settings={...old,farm:f,epc:e,range:$('#s3').value,...ex};if(saveData()){FEED_LOW=null;qPending({action:'settings.save',json:JSON.stringify({farm:f,epc:e,range:$('#s3').value,...ex})});notify('Settings saved');go('settings')}else DB.settings=old}
async function clearAll(){if(!need('settings'))return;if(!await confirmAction('This deletes <b>every record</b>: batches, production, mortality, orders, sales, expenses, inventory and pending entries'+(sheetsOn()?', here <b>and in your Google Sheet record tabs</b>':' stored in this browser')+'. It cannot be undone.','Delete all records'))return;if(sheetsOn()){const r=await srvPost({action:'data.clear'});if(!r.ok)return notify('Could not clear the Google Sheet: '+r.error,'e')}const st=DB.settings,snap=JSON.stringify(DB),q=SQ;seed();DB.settings=st;SQ=[];sqSave();if(saveData()){notify('All records deleted');go('settings')}else{DB=JSON.parse(snap);SQ=q;sqSave()}}

/* A non-admin's new entry OR change to an existing record is sent to the admin; nothing is applied until it is approved. */
async function proposeEdit(k,rec,id){
 const had=pend(k).find(x=>x.id===id&&x._vs==='Pending verification');
 if(had){const d=await srvPost({action:'pending.remove',module:k,id});if(!d||!d.ok)return{ok:false,error:(d&&d.error)||'Could not replace your earlier waiting change.'}}
 const r=await srvPost({action:'submit',module:k,record:rec});if(!r.ok)return{ok:false,error:r.error||'Could not submit the entry.'};
 const nr={...rec,...r.record};
 if(nr.id!==id&&DB[k].some(x=>x.id===id)){await srvPost({action:'pending.remove',module:k,id:nr.id});return{ok:false,error:'The server gave this change a new number, so it was cancelled. The Apps Script must accept an existing number for edits.'}}
 DB.pending[k]=pend(k).filter(x=>!(x.id===id&&x._vs==='Pending verification'));DB.pending[k].push(nr);saveData();return{ok:true,rec:nr}}

/* ---------- eggs in stock (automatic) and feed alert ---------- */
function eggStock(){
 const s=DB.settings,epc=+s.epc||30,open=+s.eggOpen||0;
 const st=s.eggStart||'';
 const good=sum(DB.production.filter(r=>!st||r.date>=st),r=>Math.max(0,(+r.eggs||0)-(+r.broken||0)-(+r.cracked||0)));
 const sold=sum(DB.sales.filter(x=>x.product==='Eggs'&&(!st||x.date>=st)),x=>+x.qty||0)*(s.eggUnit==='eggs'?1:epc);
 const n=Math.round(open+good-sold),a=Math.abs(n);
 return{n,epc,good,sold,open,st,crates:(n<0?-1:1)*Math.floor(a/epc),loose:a%epc}}
function feedInfo(){
 const s=DB.settings,items=DB.inventory.filter(i=>i.category==='Feed'),tot=sum(items,i=>+M.inventory.v.current(i)||0),units=[...new Set(items.map(i=>String(i.unit||'').trim()).filter(Boolean))];
 return{on:!!s.feedOn&&+s.feedLvl>0&&items.length>0,lvl:+s.feedLvl||0,tot:Math.round(tot*100)/100,unit:units.length===1?units[0]:'',items,low:!!s.feedOn&&+s.feedLvl>0&&items.length>0&&tot<=+s.feedLvl}}
let FEED_LOW=null;
function feedCheck(){
 if(!ME)return;const fi=feedInfo();
 if(!fi.low){FEED_LOW=false;return}
 if(FEED_LOW===true)return;FEED_LOW=true;
 const msg='Feed is low: '+fi.tot+' '+fi.unit+' left (alert level '+fi.lvl+').';
 try{notify('⚠️ '+msg,'e')}catch(e){}
 try{if(window.AppInventor&&window.AppInventor.setWebViewString)AppInventor.setWebViewString('FEED_LOW#'+msg)}catch(e){}
 try{if('Notification' in window&&Notification.permission==='granted')new Notification(DB.settings.farm||'Feed alert',{body:msg});else if('Notification' in window&&Notification.permission==='default')Notification.requestPermission()}catch(e){}}

/* ---------- combine batches (admin only) ---------- */
const MK=['production','mortality','orders','sales','expenses'];
const mergeSel=()=>[...document.querySelectorAll('.mgc:checked')].map(x=>x.value);
const mergeSnap=()=>JSON.stringify([DB.batches,...MK.map(k=>DB[k])]);
function mergeRestore(s){const a=JSON.parse(s);DB.batches=a[0];MK.forEach((k,i)=>DB[k]=a[i+1])}
function mergePlan(tid,ids){
 const bs=ids.map(i=>DB.batches.find(b=>b.id===i)),t=bs.find(b=>b.id===tid),o=bs.filter(b=>b.id!==tid);
 const cc=b=>+b.chickCost||(+b.initial||0)*(+b.cpc||0),uniq=a=>[...new Set(a.map(x=>String(x||'').trim()).filter(Boolean))];
 const initial=sum(bs,'initial'),chick=sum(bs,cc);
 return{t,o,bs,chick,rec:{...t,initial,additions:sum(bs,'additions'),hens:sum(bs,'hens'),notlaying:sum(bs,'notlaying'),roosters:sum(bs,'roosters'),chickCost:chick,cpc:initial?chick/initial:0,
  arrival:bs.map(b=>b.arrival).filter(Boolean).sort()[0]||t.arrival,supplier:uniq(bs.map(b=>b.supplier)).join(', '),housing:uniq(bs.map(b=>b.housing)).join(', ')}}}
function mergeApply(p,name){
 const ids=p.o.map(b=>b.id),moved=[];
 MK.forEach(k=>DB[k].forEach(r=>{if(ids.includes(r.batch)){r.batch=p.t.id;moved.push([k,r.id])}}));
 const i=DB.batches.findIndex(b=>b.id===p.t.id);DB.batches[i]={...p.rec,name};
 DB.batches=DB.batches.filter(b=>!ids.includes(b.id));return moved}
function mergeForm(){
 if(!need('edit'))return;
 if(DB.batches.length<2)return notify('You need at least two batches to combine.','e');
 modal(`<h3>Combine batches</h3><div id="ferr"></div><p class="note">Tick the batches to combine. Their egg production, mortality, orders, sales and expenses all move into the batch you keep. The other batches are then removed.</p>
 <div class="fg">${DB.batches.map(b=>`<label style="display:flex;gap:8px;align-items:center"><input type="checkbox" class="mgc" value="${esc(b.id)}" onchange="mergeUpdate()" style="width:auto"><span><b>${esc(b.id)}</b> · ${esc(b.name)} · ${esc(b.type)} · ${liveBirds(b)} live · ${esc(b.status)}</span></label>`).join('')}</div>
 <div class="fg"><label>Keep this batch (the others merge into it)<select id="mgt" onchange="mergeUpdate()"></select></label><label>Name of combined batch<input id="mgn" oninput="this.dataset.d=1"></label></div>
 <div id="mgp" class="note"></div>
 <div class="act"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn" onclick="mergeDo()">Combine batches</button></div>`)}
function mergeUpdate(){
 const ids=mergeSel(),sel=$('#mgt'),n=$('#mgn'),prev=sel.value;
 sel.innerHTML=ids.map(i=>`<option value="${esc(i)}">${esc(i)} · ${esc(DB.batches.find(x=>x.id===i).name)}</option>`).join('');
 if(ids.includes(prev))sel.value=prev;
 if(!n.dataset.d&&ids.length)n.value=DB.batches.find(b=>b.id===sel.value).name;
 if(ids.length<2){$('#mgp').textContent=ids.length?'Tick at least one more batch.':'';return}
 const p=mergePlan(sel.value,ids),snap=mergeSnap(),before=sum(p.bs,b=>liveBirds(b)),costB=sum(p.bs,b=>batchCost(b.id));let after,costA,mv;
 try{mv=mergeApply(p,n.value);const t=DB.batches.find(b=>b.id===p.t.id);after=liveBirds(t);costA=batchCost(t.id)}finally{mergeRestore(snap)}
 const types=[...new Set(p.bs.map(b=>b.type))];
 $('#mgp').innerHTML=`<b>Result:</b> ${p.rec.initial} birds started · live birds ${before} → <b>${after}</b> · cost to date ${money(costB)} → <b>${money(costA)}</b> · ${mv.length} record(s) move to ${esc(p.t.id)}`
  +(before!==after?`<br><span style="color:#991B1B">Warning: ${before-after} bird(s) would stop being counted, because some of these batches have hens/roosters filled in and others do not. After combining, edit the batch and fix the Hens / Roosters figures.</span>`:'')
  +(types.length>1?`<br>These batches have different bird types (${types.map(esc).join(', ')}). The combined batch will be ${esc(p.t.type)}.`:'')}
async function mergeDo(){
 if(!need('edit'))return;
 const ids=mergeSel(),tid=$('#mgt').value,name=$('#mgn').value.trim(),err=[];
 if(ids.length<2)err.push('Tick at least two batches.');
 if(!name)err.push('Enter a name for the combined batch.');
 if(DB.batches.some(b=>!ids.includes(b.id)&&b.name.toLowerCase()===name.toLowerCase()))err.push('Another batch already uses this name.');
 if(MK.some(k=>pend(k).some(r=>ids.includes(r.batch))))err.push('Some entries for these batches are still pending verification. Approve or reject them in Approvals first.');
 if(err.length){$('#ferr').innerHTML='<div class="err" role="alert">'+err.map(esc).join('<br>')+'</div>';return}
 const p=mergePlan(tid,ids);
 if(!await confirmAction(`Combine <b>${ids.map(esc).join(', ')}</b> into <b>${esc(tid)}</b> (named “${esc(name)}”)? The other batches are removed and this cannot be undone.`,'Combine'))return;
 const snap=mergeSnap(),note='Combined on '+fmtD(today())+' from '+p.bs.map(b=>`${b.id} "${b.name}" (${b.initial} birds)`).join('; ')+'.';
 p.rec.remarks=[p.t.remarks,note].filter(Boolean).join('\n');
 const moved=mergeApply(p,name);
 if(!saveData()){mergeRestore(snap);return notify('Could not save on this device. Nothing was changed.','e')}
 moved.forEach(([k,id])=>queueSync(k,id));queueSync('batches',tid);p.o.forEach(b=>queueSync('batches',b.id));
 closeModal();notify('Combined into '+tid+' ('+moved.length+' records moved)');go('batches')}

<style>
:root{--p:#2F7D32;--pd:#1B4332;--a:#F5A524;--bg:#FBF8F1;--m:#64748B;--t:#1E1B2E}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;font:15px/1.45 system-ui,Segoe UI,Roboto,sans-serif;color:var(--t);background:linear-gradient(160deg,var(--pd) 0%,var(--p) 100%);display:flex;align-items:center;justify-content:center;padding:16px}
.card{background:#fff;border-radius:16px;box-shadow:0 10px 30px #0004;width:min(400px,100%);overflow:hidden}
.top{background:var(--bg);text-align:center;padding:24px 20px 16px;border-bottom:4px solid var(--a)}
.top .logo{font-size:44px;line-height:1}.top h1{margin:10px 0 2px;font-size:19px;color:var(--pd)}.top p{margin:0;color:var(--m);font-size:13px}
form{padding:20px}label{display:block;font-size:12px;font-weight:600;color:var(--m);margin-bottom:12px}
input{width:100%;margin-top:4px;padding:11px 12px;border:1px solid #cbd5e1;border-radius:10px;font:inherit;color:var(--t)}
input:focus{outline:2px solid var(--a);border-color:var(--a)}
.pw{position:relative}.pw button{position:absolute;right:6px;top:8px;border:0;background:none;color:var(--p);font-weight:600;cursor:pointer;padding:4px 8px}
.btn{width:100%;padding:12px;border:0;border-radius:10px;background:var(--p);color:#fff;font:inherit;font-weight:600;cursor:pointer}
.btn:hover{background:var(--pd)}.btn:disabled{opacity:.6;cursor:wait}
.err{background:#FEE2E2;color:#991B1B;border-radius:8px;padding:9px 12px;margin-bottom:12px;font-size:13px;display:none}
.note{color:var(--m);font-size:12px;text-align:center;margin:12px 0 0}
img.lg{height:110px;width:auto;max-width:80%;display:block;margin:0 auto}

<script>
/* PASTE the web app URL (ends in /exec) from your Google Apps Script deployment: */
const SCRIPT_URL='https://script.google.com/macros/s/AKfycbxXkleohJFWlOP3mfaLIMeEFUKX3WdJSE91tDVt8gSLd9If9GawAeUOHMrChTsyg8qX/exec';
const DASHBOARD='dashboard.html';
/* false = one screen: after login this page opens dashboard.html itself (easiest in App Inventor).
   true = two screens: sends LOGIN_OK# to App Inventor, and your blocks open the Dashboard screen. */
const SEPARATE_SCREENS=false;
const $=s=>document.querySelector(s);
window.addEventListener('error',e=>{const x=document.getElementById('err');if(x){x.textContent='Problem: '+(e.message||'script error')+' (tell the developer this message)';x.style.display='block'}});
function show(m){const e=$('#err');e.textContent=m;e.style.display=m?'block':'none'}
function tp(){const p=$('#p'),s=p.type==='password';p.type=s?'text':'password';$('#tg').textContent=s?'Hide':'Show'}
(function(){try{sessionStorage.removeItem('malaa_srv_session')}catch(e){}const m=location.hash.match(/^#m=(.+)$/);if(m)show(decodeURIComponent(m[1]))})();
async function signIn(ev){ev.preventDefault();show('');
 if(!/^https:\/\/script\.google\.com\/.+/.test(SCRIPT_URL))return show('Setup needed: open login.html in a text editor and paste your Apps Script web app URL into SCRIPT_URL.');
 const b=$('#go');b.disabled=true;b.textContent='Signing in…';
 try{
  const r=await fetch(SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'login',username:$('#u').value.trim(),password:$('#p').value})});
  const d=await r.json();
  if(!d.ok){show(d.error||'Sign-in failed.');b.disabled=false;b.textContent='Sign in';return}
  const payload=encodeURIComponent(btoa(unescape(encodeURIComponent(JSON.stringify({t:d.token,u:d.username,n:d.name,r:d.role,url:SCRIPT_URL})))));
